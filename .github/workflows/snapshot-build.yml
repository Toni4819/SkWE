name: Snapshot Build
on:
  push:
    branches: [ "master" ]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get version info
        id: version
        run: |
          echo "VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.0')" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish to Modrinth
        if: success()
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: d6oSmi5a
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          name: "${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHORT_SHA }}"
          version: "${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHORT_SHA }}"
          version-type: alpha
          loaders: |
            paper
          game-versions: |
            >=1.21.1
